<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#315d35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="役員会議事録">
<link rel="manifest" href="./manifest.webmanifest">
<title>役員会議事録（オフライン）</title>
<style>
:root{--green:#e0ebd9;--deep:#315d35;--line:#777}
*{box-sizing:border-box}
body{margin:0;background:#f3f5f3;color:#202124;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
header{background:var(--deep);color:white;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top))}
header h1{font-size:18px;margin:0 0 4px}
header p{font-size:12px;margin:0;opacity:.9}
main{max-width:760px;margin:auto;padding:12px}
.panel{background:white;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #00000012}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}
input,textarea{width:100%;font:inherit;font-size:16px;border:1px solid #c9cec9;border-radius:7px;padding:10px;background:#fff;color:#202124}
textarea{min-height:64px;resize:vertical}
#minutes{min-height:210px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button,.filebutton{border:0;border-radius:8px;padding:12px 10px;font:inherit;font-size:14px;font-weight:700;background:var(--deep);color:white;cursor:pointer;text-align:center}
button.secondary{background:#e8eee7;color:#203c23}
button.warn{background:#fff0df;color:#7a3b00}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions button:last-child{grid-column:1/-1}
.small{font-size:12px;color:#5f6368;line-height:1.5}
#status{font-size:12px;line-height:1.5;white-space:pre-wrap;margin-top:8px}
.saved-list button{width:100%;margin:5px 0;text-align:left}
.hidden{display:none!important}
#paper{display:none}
@media print{
 @page{size:A4 portrait;margin:8mm}
 body{background:white;color:#000}
 header,main{display:none!important}
 #paper{display:block!important;font-family:Arial,"Yu Gothic",sans-serif;font-size:9pt}
 #paper h1{text-align:center;font-size:16pt;margin:0 0 4mm}
 table{width:100%;border-collapse:collapse;table-layout:fixed}
 td,th{border:.5pt solid #777;padding:2mm;vertical-align:top;overflow-wrap:anywhere}
 .key{background:var(--green);width:22mm;font-weight:bold}
 .section{background:var(--green);text-align:center;font-weight:bold}
 .minutes{white-space:pre-wrap;line-height:1.25;font-size:9pt;overflow-wrap:anywhere}
 .smallprint{font-size:7.5pt;margin-top:2mm}
}
</style>
</head>
<body>
<header>
  <h1>役員会議事録</h1>
  <p>オフライン入力・端末保存・A4縦印刷</p>
</header>
<main>
  <section class="panel">
    <p class="small">初回はインターネット接続中にこのページを開いてください。以後、読み込み済みならオフラインでも入力・保存・印刷できます。入力内容はこのiPhoneのブラウザ内に保存されます。</p>
    <label for="meetingName">会議名・回数</label><input id="meetingName" value="第　回 役員会" autocomplete="off">
    <div class="grid">
      <div><label for="date">開催日</label><input id="date" type="date"></div>
      <div><label for="time">開始時刻</label><input id="time" type="time" value="13:00"></div>
    </div>
    <label for="place">場所</label><input id="place" value="2階会議室">
    <label for="schoolAttendees">学校 出席者</label><textarea id="schoolAttendees">西村校長、中西副校長、矢出教頭</textarea>
    <label for="ptaAttendees">育友会 出席者</label><textarea id="ptaAttendees">会長／浦島、副会長／川村、小川、津守</textarea>
    <label for="roles">役割・担当者</label><textarea id="roles">会計監査／川崎、田中、生指部長／南出、保体部長／有北、有朋部長／栗山、会計／加藤、広報幹事／竹中、岡本、高垣、藤原、会務幹事／中東、雑賀、仲村、石井、橋本、濱口、細田、宮崎、中村</textarea>
    <label for="minutes">議事内容（必須）</label>
    <textarea id="minutes" placeholder="議題・話し合った内容・決定事項・担当者・期限など"></textarea>
    <p class="small">目安：議事内容は簡潔にまとめてください。文章量が多いとA4・1枚を超える場合があります。</p>
  </section>
  <section class="panel">
    <div class="actions">
      <button onclick="saveDraft()">この内容を保存</button>
      <button class="secondary" onclick="printMinutes()">印刷プレビュー</button>
      <button class="secondary" onclick="newDraft()">新しい議事録</button>
      <button class="secondary" onclick="exportJson()">Googleドキュメント作成用データを書き出す</button>
      <button class="warn" onclick="showSaved()">保存した議事録を呼び出す</button>
    </div>
    <div id="status" role="status">入力内容は端末内に自動保存されます。</div>
  </section>
  <section class="panel saved-list hidden" id="savedPanel">
    <strong>保存した議事録</strong><div id="savedItems"></div>
  </section>
</main>

<section id="paper" aria-label="印刷用議事録">
  <h1>議 事 録</h1>
  <table>
    <tr><td class="key">議題</td><td id="pMeeting"></td></tr>
    <tr><td class="key">日時</td><td id="pDate"></td></tr>
    <tr><td class="key">場所</td><td id="pPlace"></td></tr>
    <tr><td class="key">学校</td><td id="pSchool"></td></tr>
    <tr><td class="key">育友会</td><td id="pPta"></td></tr>
    <tr><td class="key">役割・担当</td><td id="pRoles"></td></tr>
    <tr><th class="section" colspan="2">議事内容</th></tr>
    <tr><td colspan="2" class="minutes" id="pMinutes"></td></tr>
  </table>
  <div class="smallprint">※オフライン版で作成した印刷用記録です。</div>
</section>
<script>
const FIELD_IDS=['meetingName','date','time','place','schoolAttendees','ptaAttendees','roles','minutes'];
const CURRENT_KEY='minutes_draft_current_v1';
const LIST_KEY='minutes_draft_list_v1';
function val(id){return document.getElementById(id).value.trim()}
function getData(){let o={};FIELD_IDS.forEach(k=>o[k]=document.getElementById(k).value);o.updatedAt=new Date().toISOString();return o}
function setData(o){FIELD_IDS.forEach(k=>{if(o[k]!==undefined)document.getElementById(k).value=o[k]})}
function getList(){try{return JSON.parse(localStorage.getItem(LIST_KEY)||'[]')}catch(e){return []}}
function putList(list){localStorage.setItem(LIST_KEY,JSON.stringify(list))}
function autoSave(){try{localStorage.setItem(CURRENT_KEY,JSON.stringify(getData()));document.getElementById('status').textContent='端末内に自動保存済み';}catch(e){document.getElementById('status').textContent='保存できません。ブラウザの空き容量・設定を確認してください。'}}
FIELD_IDS.forEach(k=>document.getElementById(k).addEventListener('input',autoSave));
function saveDraft(){
 const d=getData();if(!d.minutes.trim()){alert('議事内容を入力してください。');return}
 let list=getList();d.id=crypto.randomUUID?crypto.randomUUID():String(Date.now());
 list.unshift(d);putList(list.slice(0,50));localStorage.setItem(CURRENT_KEY,JSON.stringify(d));
 document.getElementById('status').textContent='保存しました。保存した議事録は「保存した議事録を呼び出す」から再編集できます。';
}
function newDraft(){
 if(!confirm('現在の内容を保存してから新しい議事録を始めますか？'))return;
 const d=getData();if(d.minutes.trim()){let list=getList();d.id=crypto.randomUUID?crypto.randomUUID():String(Date.now());list.unshift(d);putList(list.slice(0,50))}
 const today=new Date();setData({meetingName:'第　回 役員会',date:today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0'),time:'13:00',minutes:''});
 autoSave();document.getElementById('status').textContent='新しい議事録を入力できます。';
}
function showSaved(){
 const panel=document.getElementById('savedPanel'),root=document.getElementById('savedItems');
 root.innerHTML='';const list=getList();
 if(!list.length){root.textContent='保存済みの議事録はありません。';}
 list.forEach(d=>{const b=document.createElement('button');b.className='secondary';b.textContent=(d.date||'日付未設定')+'｜'+(d.meetingName||'会議名未設定');b.onclick=()=>{setData(d);autoSave();document.getElementById('status').textContent='保存した議事録を呼び出しました。';};root.appendChild(b)});
 panel.classList.toggle('hidden');
}
function printMinutes(){
 if(!val('minutes')){alert('議事内容を入力してください。');return}
 const d=getData();const dateLabel=d.date?new Date(d.date+'T00:00:00').toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric'}):'';
 const put=(id,text)=>document.getElementById(id).textContent=text||'';
 put('pMeeting',d.meetingName);put('pDate',dateLabel+(d.time?'　'+d.time:''));put('pPlace',d.place);
 put('pSchool',d.schoolAttendees);put('pPta',d.ptaAttendees);put('pRoles',d.roles);put('pMinutes',d.minutes);
 autoSave();window.print();
}

 async function exportJson(){
  const d = getData();
  if(!d.minutes.trim()){
    alert('議事録内容を入力してください。');
    return;
  }

  const blob = new Blob(
    [JSON.stringify({format:'minutes-offline-v1',records:[d]},null,2)],
    {type:'application/json'}
  );

  const safe = (d.date || 'no-date').replace(/[^0-9-]/g,'');
  const file = new File(
    [blob],
    '役員会議事録_' + safe + '.json',
    {type:'application/json'}
  );

  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({
        files:[file],
        title:'議事録JSONを保存'
      });
      document.getElementById('status').textContent =
        '共有メニューを開きました。保存先を選んでください。';
    }catch(e){
      if(e.name !== 'AbortError'){
        document.getElementById('status').textContent =
          '共有できませんでした。もう一度お試しください。';
      }
    }
  }else{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = file.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    document.getElementById('status').textContent =
      'JSONを書き出しました。保存先を確認してください。';
  }
}

}
(function init(){
 try{const saved=localStorage.getItem(CURRENT_KEY);if(saved){setData(JSON.parse(saved));}
 else {const t=new Date();document.getElementById('date').value=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');}
 }catch(e){}
 if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body>
</html>
